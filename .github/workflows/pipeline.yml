name: CI/CD Pipeline

# feature/* -> develop -> master
#   - Pull request into develop or master: CI only (typecheck, lint, build).
#   - Pull request into master: also fails unless it comes from develop in this repository.
#   - Push to develop or master: the same CI.
#
# Vercel's Git integration publishes the site: master is production (thegoldenpothos.xyz) and
# develop is served at sit.thegoldenpothos.xyz (vercel.json holds the build settings).
# This workflow holds no secret, no GitHub environment and no hosting token.
# A workflow cannot stop a direct push to master; the branch ruleset on GitHub does that.
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: pipeline-${{ github.ref }}
  # A superseded pull request run is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  master-source:
    name: Only develop merges into master
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Pull requests into master must come from develop in $THIS_REPO (this one is from $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source is $HEAD_REPO:$HEAD_REF, OK."

  verify:
    name: Build and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Fails on any ESLint error except the known baseline (ThemeProvider.tsx:25); see scripts/lint-new.mjs.
      - run: npm run lint:new

      - run: npm run build
